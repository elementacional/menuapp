<div class="shell" id="shell"><aside class="nav"><div class="brand"><div class="brandmark">▱</div><div class="brandtext"><b>AppHub Studio</b><div class="sub">Biblioteca de aplicativos</div></div></div><div id="navbody" class="navbody"></div><div class="navfoot"><button class="navitem" id="toggleNav" title="Expandir ou recolher barra"><span class="navsymbol">☰</span><span class="navlabel">Recolher / expandir</span></button><button class="navitem" id="settings" title="Gerenciar categorias"><span class="navsymbol">⚙</span><span class="navlabel">Gerenciar categorias</span></button></div></aside>

t"><span id="previewTip">Nenhuma prévia enviada</span></div><label class="help"><input type="checkbox" id="clearPreview"> Remover capa cadastrada</label></div></div><div class="rowactions"><button type="button" class="ghost" id="removeApp">Excluir app</button><button type="button" class="ghost" data-close="editDialog">Cancelar</button><button type="submit" class="greenbutton">Salvar aplicativo</button></div></form></div></div>
<div id="readmeDialog" class="dialog" role="dialog" aria-modal="true"><div class="modal wide"><div class="modalheader"><h2 id="readmeTitle">README</h2><button class="iconbutton" data-close="readmeDialog" aria-label="Fechar">✕</button></div><div id="readmeContent" class="readme"></div><div class="rowactions"><a id="readmeLink" class="ghost" target="_blank" rel="noopener noreferrer" style="text-decoration:none" hidden>Abrir arquivo original ↗</a></div></div></div>
<div id="categoriesDialog" class="dialog" role="dialog" aria-modal="true"><div class="modal"><div class="modalheader"><h2>Categorias</h2><button class="iconbutton" data-close="categoriesDialog" aria-label="Fechar">✕</button></div><div id="categoryList"></div><div class="double"><div class="field"><label for="newCategory">Nova categoria</label><input id="newCategory" maxlength="45" placeholder="Ex.: Imagem"></div><div class="field"><label for="newSymbol">Símbolo (emoji)</label><input id="newSymbol" maxlength="5" value="◈"></div></div><div class="rowactions"><button class="greenbutton" id="addCategory">＋ Adicionar categoria</button></div></div></div>
<script>
(()=>{'use strict';
const KEY='apphub-studio-category-v1';
const defaults={categories:[
{id:'pdf',name:'PDF',symbol:'▤',code:'PDF'},
{id:'docs',name:'DOCs',symbol:'▧',code:'DOC'},
{id:'image',name:'Image',symbol:'▧',code:'IMG'},
{id:'audio',name:'Audio',symbol:'♫',code:'AUD'},
{id:'video',name:'Video',symbol:'▷',code:'VID'},
{id:'tools',name:'Tools',symbol:'⚒',code:'TOL'},
{id:'school',name:'School',symbol:'♧',code:'SCH'},
{id:'maps',name:'Maps',symbol:'⌖',code:'MAP'},
{id:'internet',name:'Internet',symbol:'◎',code:'INT'},
{id:'web',name:'WEB',symbol:'⌘',code:'WEB'},
{id:'livros',name:'Livros',symbol:'▥',code:'LIV'}],apps:[
{id:'pageforge',name:'PageForge',description:'Unir imagens e exportar PDF',category:'pdf',url:'',icon:'📄'},
{id:'pdftodoc',name:'PDF to Doc',description:'Conversão de PDF em Word',category:'pdf',url:'',icon:'📑'},
{id:'mergedocs',name:'Merge Docs',description:'Unir documentos',category:'docs',url:'',icon:'📚'},
{id:'drawup',name:'Draw-up Vetor',description:'Desenhos vetoriais',category:'image',url:'',icon:'✒️'},
{id:'audioplayer',name:'Audio Player',description:'Reprodutor de áudio',category:'audio',url:'',icon:'🎧'},
{id:'audiostudio',name:'Audio Studio MP3',description:'Edição de áudio',category:'audio',url:'',icon:'🎚️'},
{id:'pdfeditor',name:'PDF Editor',description:'Editor de arquivos PDF',category:'pdf',url:'',icon:'📝'},
{id:'audiocaption',name:'Audio Caption',description:'Legenda e transcrição',category:'audio',url:'',icon:'💬'},
{id:'gpsgeo',name:'GPS Geo',description:'Projeto de geolocalização',category:'maps',url:'',icon:'📍'},
{id:'mp3totxt',name:'MP3 to TXT',description:'Transcrição de áudio',category:'audio',url:'',icon:'🎙️'},
{id:'audiototxt',name:'Audio to TXT',description:'Conversão de áudio em texto',category:'audio',url:'',icon:'🎤'},
{id:'spotify',name:'Convert Spotify',description:'Ferramenta de áudio',category:'audio',url:'',icon:'🎵'},
{id:'splitpdf',name:'Split PDF',description:'Dividir e recortar páginas PDF',category:'pdf',url:'',icon:'✂️'}]};
const migrate=(raw)=>{const obj=raw&&typeof raw==='object'?raw:clone(defaults);const mapping={design:'image',geo:'maps'};obj.apps=Array.isArray(obj.apps)?obj.apps:clone(defaults.apps);obj.categories=Array.isArray(obj.categories)?obj.categories:[];
for(const a of obj.apps){if(mapping[a.category])a.category=mapping[a.category];if(a.category==='docs'&&(/pdf|pageforge/i.test(a.name)))a.category='pdf';}
const builtins=clone(defaults.categories);const extras=obj.categories.filter(c=>!builtins.some(x=>x.id===c.id)&&!mapping[c.id]);obj.categories=[...builtins,...extras];return obj;};
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
 const LEGACY_KEYS=['apphub-studio-v12','apphub-studio-v11'];
 const legacyCategory=name=>{const n=String(name||'').toLowerCase();if(/pdf|pageforge/.test(n))return 'pdf';if(/doc|markdown/.test(n))return 'docs';if(/draw|imagem|picture/.test(n))return 'image';if(/audio|mp3|spotify|concert/.test(n))return 'audio';if(/geo|gps|map/.test(n))return 'maps';if(/web|landing|loop/.test(n))return 'web';if(/turismo|imersiva/.test(n))return 'internet';return 'tools'};
 const legacyToCurrent=a=>({id:String(a.id||'legacy_'+a.name),name:a.name||'Sem nome',description:a.desc||a.description||'',category:legacyCategory(a.name),url:a.url||'',readmeUrl:a.readmeUrl||a.repo||'',readmeText:a.readmeText||'',icon:a.emoji||'◈',iconImage:a.icon||a.svg||null,preview:a.preview||null,previewUrl:a.previewUrl||''});
 const getSaved=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};
 let state;const current=getSaved(KEY);state=current&&Array.isArray(current.apps)&&Array.isArray(current.categories)?migrate(current):clone(defaults);
 const previous=LEGACY_KEYS.map(k=>({key:k,data:getSaved(k)})).find(x=>Array.isArray(x.data)&&x.data.length>0);
 let restoredFromLegacy=0;
 if(previous){const migrated=previous.data.map(legacyToCurrent);const existing=state.apps;const index=new Map(existing.map((a,i)=>[String(a.name||'').toLowerCase(),i]));for(const a of migrated){const i=index.get(String(a.name||'').toLowerCase());if(i===undefined){existing.push(a);restoredFromLegacy++}else{const entry=existing[i];if(!entry.url&&a.url)entry.url=a.url;if(!entry.iconImage&&a.iconImage)entry.iconImage=a.iconImage;if(!entry.readmeUrl&&a.readmeUrl)entry.readmeUrl=a.readmeUrl;if(!entry.description&&a.description)entry.description=a.description;restoredFromLegacy++}}}
 let selected='all',draftIcon=null,draftPreview=null;
 if(previous&&restoredFromLegacy){try{localStorage.setItem('apphub-legacy-rescue-'+previous.key,JSON.stringify(previous.data));localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Não foi possível salvar a migração. Os dados antigos foram preservados.',e)}}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Armazenamento do navegador cheio. Reduza o tamanho das imagens ou exporte um backup.');return false}};
const escaped=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const allowedUrl=u=>{u=(u||'').trim();if(!u)return '';if(/^\s*(javascript|data|vbscript):/i.test(u))return '';return u};
const safePreviewUrl=u=>{try{const x=new URL(String(u||''),location.href);return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}};
 const framePreview=u=>{const url=safePreviewUrl(u);if(!url)return '';return '<iframe class="live-frame" loading="lazy" tabindex="-1" aria-hidden="true" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin" src="'+escaped(url)+'"></iframe><span class="live-badge">Prévia do site</span>'};
 const openLink=u=>{u=allowedUrl(u);if(!u){alert('O endereço ainda não foi cadastrado. Clique no lápis para adicioná-lo.');return}window.open(u,'_blank','noopener,noreferrer')};
function renderNav(){const nav=$('navbody');nav.innerHTML='';const all=[{id:'all',name:'Todos os apps',symbol:'▦'},...state.categories];all.forEach(c=>{const b=document.createElement('button');b.className='navitem'+(selected===c.id?' active':'');b.title=c.name;b.setAttribute('aria-label',c.name);b.innerHTML=`<span class="navsymbol">${escaped(c.symbol)}</span><span class="navlabel">${escaped(c.name)}</span>`;b.addEventListener('click',()=>{selected=c.id;$('search').value='';render()});nav.append(b)})}
function render(){renderNav();const cat=state.categories.find(c=>c.id===selected);$('categoryChip').textContent='Categoria: '+(cat?cat.name:'Todos os apps');$('subtitle').textContent=cat?'Exibindo apenas os aplicativos de '+cat.name+'.':'Todos os aplicativos em ordem alfabética. Selecione uma categoria para filtrar.';
const q=$('search').value.toLocaleLowerCase('pt-BR');const apps=state.apps.filter(a=>(selected==='all'||a.category===selected)&&(`${a.name} ${a.description||''}`).toLocaleLowerCase('pt-BR').includes(q)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR',{sensitivity:'base',numeric:true}));$('count').textContent=`${apps.length} de ${state.apps.length} apps`;
const list=$('cards');list.innerHTML='';if(!apps.length){list.innerHTML='<div class="empty">Nenhum aplicativo encontrado nesta categoria.<br>Use “Novo app” para cadastrar um.</div>';return}
for(const a of apps){const c=document.createElement('article');c.className='card';const img=safePreviewUrl(a.previewUrl)||a.preview;const pre=img?`<img class="preview-image" alt="Prévia de ${escaped(a.name)}" src="${escaped(img)}" loading="lazy">`:framePreview(a.url)||`<div class="placeholder"><div class="placeholder-icon">${escaped(a.icon||'▧')}</div><small>Cadastre uma URL ou imagem de capa</small></div>`;const ico=a.iconImage?`<img alt="Ícone de ${escaped(a.name)}" src="${escaped(a.iconImage)}">`:escaped(a.icon||'◈');const category=state.categories.find(x=>x.id===a.category);const abbrev=(category?.code||category?.name?.slice(0,3)||'OUT').toLocaleUpperCase('pt-BR').slice(0,3);
c.innerHTML=`<div class="preview">${pre}</div><div class="body"><div class="cardrow"><div class="appheading"><div class="appname" title="${escaped(a.name)}">${escaped(a.name)}</div><div class="desc">${escaped(a.description||'Sem descrição')}</div></div><div class="appicon" title="Ícone personalizado">${ico}</div></div><div class="buttons"><button class="greenbutton small launch" data-act="open" title="Abrir aplicativo"><span class="power">⏻</span> Abrir app</button>${selected==='all'?`<span class="category-code" title="Categoria: ${escaped(category?.name||'Outra')}">${escaped(abbrev)}</span>`:''}<button class="iconbutton small" data-act="readme" title="Abrir README" aria-label="README de ${escaped(a.name)}">▣</button><button class="iconbutton small" data-act="edit" title="Editar dados, ícone e capa" aria-label="Editar ${escaped(a.name)}">✎</button></div></div>`;
const preview=c.querySelector('.preview');const frame=preview.querySelector('.live-frame');if(frame){const resize=()=>frame.style.setProperty('--frame-scale',Math.min(preview.clientWidth/1280,preview.clientHeight/800).toFixed(4));resize();}const pic=preview.querySelector('.preview-image');if(pic)pic.onerror=()=>{pic.remove();preview.innerHTML='<div class="placeholder"><div class="placeholder-icon">▧</div><small>Imagem indisponível. Edite a capa.</small></div>'};c.querySelector('[data-act=open]').onclick=()=>openLink(a.url);c.querySelector('[data-act=readme]').onclick=()=>showReadme(a);c.querySelector('[data-act=edit]').onclick=()=>edit(a.id);list.append(c)}}
function dialog(id,show=true){$(id).classList.toggle('show',show)}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dialog(b.dataset.close,false));document.querySelectorAll('.dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)dialog(d.id,false)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.dialog').forEach(d=>dialog(d.id,false))});
$('toggleNav').onclick=()=>{const x=$('shell').classList.toggle('expanded');$('toggleNav').title=x?'Recolher barra':'Expandir barra'};
$('search').oninput=render;$('addApp').onclick=()=>edit(null);
function edit(id){const a=state.apps.find(x=>x.id===id)||{name:'',description:'',category:selected==='all'?(state.categories[0]?.id||'tools'):selected,url:'',readmeUrl:'',readmeText:'',icon:'◈'};$('editTitle').textContent=id?'Editar aplicativo':'Novo aplicativo';$('appId').value=id||'';for(const k of ['name','description','url','readmeUrl','readmeText','previewUrl'])$(k).value=a[k]||'';$('category').innerHTML=state.categories.map(c=>`<option value="${escaped(c.id)}">${escaped(c.name)}</option>`).join('');$('category').value=a.category;$('iconFile').value='';$('previewFile').value='';$('readmeFile').value='';$('clearIcon').checked=false;$('clearPreview').checked=false;draftIcon=a.iconImage||null;draftPreview=a.preview||null;$('iconTip').textContent=draftIcon?'Ícone cadastrado':'Nenhum ícone enviado';$('previewTip').textContent=draftPreview?'Preview cadastrado':'Nenhuma prévia enviada';$('removeApp').hidden=!id;dialog('editDialog')}
function readImage(file,callback){if(!file)return;if(!file.type.startsWith('image/')){alert('Selecione um arquivo de imagem.');return}const r=new FileReader();r.onload=()=>callback(String(r.result));r.readAsDataURL(file)}
$('readmeFile').onchange=async e=>{const file=e.target.files[0];if(file)$('readmeText').value=await file.text()};$('iconFile').onchange=e=>readImage(e.target.files[0],v=>{draftIcon=v;$('iconTip').textContent='Novo ícone selecionado'});$('previewFile').onchange=e=>readImage(e.target.files[0],v=>{draftPreview=v;$('previewTip').textContent='Nova imagem selecionada'});
$('appForm').onsubmit=e=>{e.preventDefault();const id=$('appId').value;let a=state.apps.find(x=>x.id===id);if(!a){a={id:'app_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),icon:'◈'};state.apps.push(a)}for(const k of ['name','description','category','url','readmeUrl','readmeText','previewUrl'])a[k]=$(k).value.trim();a.iconImage=$('clearIcon').checked?null:draftIcon;a.preview=$('clearPreview').checked?null:draftPreview;if(save()){dialog('editDialog',false);render()}};
$('removeApp').onclick=()=>{const id=$('appId').value;if(!id||!confirm('Excluir este aplicativo da biblioteca?'))return;state.apps=state.apps.filter(a=>a.id!==id);save();dialog('editDialog',false);render()};
function showReadme(a){$('readmeTitle').textContent='README · '+a.name;const content=$('readmeContent');content.textContent=a.readmeText||'Não existe texto de README salvo neste aplicativo. Para leitura offline, cole o conteúdo no campo README ao editar o aplicativo.';const link=$('readmeLink');const url=allowedUrl(a.readmeUrl);link.hidden=!url;if(url)link.href=url;else link.removeAttribute('href');dialog('readmeDialog')}
$('settings').onclick=()=>{renderCategories();dialog('categoriesDialog')};
function renderCategories(){const box=$('categoryList');box.innerHTML='';state.categories.forEach(cat=>{const n=state.apps.filter(a=>a.category===cat.id).length;const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #2a3b52';const title=document.createElement('span');title.textContent=`${cat.symbol}  ${cat.name} · ${n} app(s)`;const actions=document.createElement('div');actions.style.cssText='display:flex;gap:5px';const rename=document.createElement('button');rename.className='iconbutton small';rename.title='Renomear';rename.textContent='✎';rename.onclick=()=>{const name=prompt('Nome da categoria:',cat.name);if(name?.trim()){cat.name=name.trim();save();renderCategories();render()}};const del=document.createElement('button');del.className='iconbutton small';del.title='Excluir categoria vazia';del.textContent='×';del.onclick=()=>{if(defaults.categories.some(x=>x.id===cat.id)){alert('Esta é uma categoria principal do AppHub e não pode ser removida.');return}if(n){alert('Mova os aplicativos para outra categoria antes de excluir esta.');return}if(!confirm('Excluir categoria '+cat.name+'?'))return;state.categories=state.categories.filter(c=>c.id!==cat.id);if(selected===cat.id)selected='all';save();renderCategories();render()};actions.append(rename,del);row.append(title,actions);box.append(row)})}
$('addCategory').onclick=()=>{const name=$('newCategory').value.trim();if(!name)return;if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){alert('Esta categoria já existe.');return}state.categories.push({id:'cat_'+Date.now(),name,symbol:$('newSymbol').value.trim()||'◈',code:name.slice(0,3).toLocaleUpperCase('pt-BR')});$('newCategory').value='';save();renderCategories();render()};
$('exportData').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='apphub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
$('importData').onclick=()=>$('fileImport').click();$('fileImport').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.apps)||!Array.isArray(obj.categories))throw Error();if(!confirm('Substituir sua biblioteca atual pelos dados do backup?'))return;state=migrate(obj);selected='all';save();render()}catch(err){alert('Arquivo de backup inválido.')}e.target.value=''};
render();
 if(previous&&restoredFromLegacy){const msg=document.createElement('div');msg.style.cssText='position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:5000;background:#173d30;border:1px solid #3aaf83;border-radius:12px;color:white;padding:12px 16px;box-shadow:0 9px 30px #000a;max-width:90vw';msg.innerHTML='<strong>Catálogo anterior recuperado.</strong> Verifique os aplicativos e clique em Backup para salvar uma cópia. <button type="button" style="margin-left:8px;padding:5px 10px;border-radius:7px;cursor:pointer">Fechar</button>';msg.querySelector('button').onclick=()=>msg.remove();document.body.append(msg)}
})();
</script>
</body></html>
